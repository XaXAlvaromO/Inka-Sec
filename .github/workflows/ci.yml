name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend - Tests + Cobertura + SAST
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mi-api-fastapi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      # tests/conftest.py configura SQLite en memoria y un secreto de prueba.
      - name: Ejecutar pruebas con cobertura
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=85

      - name: SAST con Bandit
        run: bandit -r app -ll -i -f json -o bandit-report.json

      - name: Guardar el reporte de Bandit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-bandit
          path: mi-api-fastapi/bandit-report.json
          retention-days: 14

      - name: Guardar el reporte de cobertura del backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: mi-api-fastapi/htmlcov/
          retention-days: 14

  frontend:
    name: Frontend - Lint + Tests + Cobertura + Build + Audit + SAST
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas con cobertura
        run: npm run test:coverage

      - name: Guardar el reporte de cobertura del frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/
          retention-days: 14

      - name: Build
        run: npm run build

      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Configurar Python para Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Semgrep
        run: python -m pip install "setuptools<82" semgrep==1.130.0

      - name: SAST del frontend con Semgrep
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: |
          semgrep scan --config p/javascript --config p/typescript --error \
            --severity ERROR \
            --exclude node_modules --exclude dist --exclude coverage \
            --json --output semgrep-report.json .

      - name: Guardar el reporte de Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-semgrep
          path: frontend/semgrep-report.json
          retention-days: 14

  deploy-dev:
    name: Deploy a Desarrollo
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Desplegar backend y frontend de desarrollo en Render
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_DEV_BACKEND_HOOK }}
          FRONTEND_HOOK: ${{ secrets.RENDER_DEV_FRONTEND_HOOK }}
        run: |
          : "${BACKEND_HOOK:?Falta el secreto RENDER_DEV_BACKEND_HOOK}"
          : "${FRONTEND_HOOK:?Falta el secreto RENDER_DEV_FRONTEND_HOOK}"
          curl --fail --silent --max-time 30 --output /dev/null --request POST -- "$BACKEND_HOOK" || {
            echo "::error::Render no aceptó el deploy del backend de desarrollo"
            exit 1
          }
          curl --fail --silent --max-time 30 --output /dev/null --request POST -- "$FRONTEND_HOOK" || {
            echo "::error::Render no aceptó el deploy del frontend de desarrollo"
            exit 1
          }

  smoke-test:
    name: Smoke Test en Dev
    needs: deploy-dev
    runs-on: ubuntu-latest

    steps:
      - name: Verificar la API a través del frontend de desarrollo
        env:
          DEV_FRONTEND_URL: ${{ vars.RENDER_DEV_FRONTEND_URL }}
        run: |
          : "${DEV_FRONTEND_URL:?Falta la variable RENDER_DEV_FRONTEND_URL}"
          for i in {1..20}; do
            if curl --fail --silent --max-time 15 -- "${DEV_FRONTEND_URL%/}/api/v1/health" \
              | jq -e '.status == "healthy" and .database == "connected"' > /dev/null; then
              echo "El frontend de desarrollo llega a la API y a la base de datos"
              exit 0
            fi
            echo "Intento $i: la ruta de salud aún no devuelve el JSON esperado"
            sleep 15
          done
          echo "::error::La ruta de salud de desarrollo no devolvió el JSON esperado"
          exit 1

  dast:
    name: DAST pasivo con OWASP ZAP en Dev
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Ejecutar ZAP Baseline
        env:
          DEV_FRONTEND_URL: ${{ vars.RENDER_DEV_FRONTEND_URL }}
        run: |
          : "${DEV_FRONTEND_URL:?Falta la variable RENDER_DEV_FRONTEND_URL}"
          mkdir -p zap-report
          chmod 0777 zap-report

          status=0
          docker run --rm --mount "type=bind,source=$PWD/zap-report,target=/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t "${DEV_FRONTEND_URL%/}/" -m 1 -T 5 \
            -r zap.html -J zap.json || status=$?

          # ZAP devuelve 2 cuando hay advertencias. El JSON determina el riesgo.
          case "$status" in
            0|2) ;;
            *) exit "$status" ;;
          esac

          jq -e '(.site | type == "array" and length > 0)' zap-report/zap.json > /dev/null
          if jq -e '[.site[].alerts[]? | select((.riskcode | tostring) == "3" and ((.confidence | tostring) == "2" or (.confidence | tostring) == "3"))] | length > 0' \
            zap-report/zap.json > /dev/null; then
            echo "::error::ZAP detectó alertas de riesgo alto (confianza media/alta) en desarrollo"
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
          fi

      - name: Guardar los reportes de ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap
          path: zap-report/
          retention-days: 14

  deploy-prod:
    name: Deploy a Producción
    needs: dast
    runs-on: ubuntu-latest
    if: vars.RENDER_PROD_ENABLED == 'true'

    steps:
      - name: Desplegar backend y frontend de producción en Render
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_PROD_BACKEND_HOOK }}
          FRONTEND_HOOK: ${{ secrets.RENDER_PROD_FRONTEND_HOOK }}
        run: |
          : "${BACKEND_HOOK:?Falta el secreto RENDER_PROD_BACKEND_HOOK}"
          : "${FRONTEND_HOOK:?Falta el secreto RENDER_PROD_FRONTEND_HOOK}"
          curl --fail --silent --max-time 30 --output /dev/null --request POST -- "$BACKEND_HOOK" || {
            echo "::error::Render no aceptó el deploy del backend de producción"
            exit 1
          }
          curl --fail --silent --max-time 30 --output /dev/null --request POST -- "$FRONTEND_HOOK" || {
            echo "::error::Render no aceptó el deploy del frontend de producción"
            exit 1
          }