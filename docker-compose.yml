services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: inkasec
      POSTGRES_USER: inkasec
      POSTGRES_PASSWORD: ${INKASEC_DB_PASSWORD:?Configura INKASEC_DB_PASSWORD en el .env de la raiz}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - inkasec_pg:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkasec -d inkasec"]
      interval: 5s
      timeout: 5s
      retries: 20


  redis:
    image: redis:7-alpine

    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20


  backend:
    build: ./mi-api-fastapi

    env_file:
      - ./mi-api-fastapi/.env

    environment:
      DATABASE_URL: postgresql+psycopg://inkasec:${INKASEC_DB_PASSWORD:?Configura INKASEC_DB_PASSWORD en el .env de la raiz}@db:5432/inkasec

    ports:
      - "8001:8000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


volumes:
  inkasec_pg:
