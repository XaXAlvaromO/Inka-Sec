# Blueprint de Render: API (Docker), frontend (sitio estático) y PostgreSQL.
# Crear desde Render: New > Blueprint > seleccionar este repositorio.
#
# Diseño: el sitio estático reenvía /api/* a la API con una regla de reescritura. Así el
# navegador ve un solo origen, y las cookies de sesión y CSRF funcionan sin CORS ni
# cookies de terceros. Render gratuito bloquea SMTP, por eso el código 2FA sale por la API HTTP de Brevo.

services:
  - type: web
    name: inkasec-api
    runtime: docker
    plan: free
    dockerContext: ./mi-api-fastapi
    dockerfilePath: ./mi-api-fastapi/Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: inkasec-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true          # 32 caracteres aleatorios (el mínimo que exige la API)
      - key: FRONTEND_ORIGIN
        sync: false                  # https://inkasec-web.onrender.com (la URL real del sitio estático)
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: TRUSTED_PROXY_HOPS
        value: "1"                   # Render añade un proxy delante de la API
      - key: SEED_DEMO_DATA
        value: "false"
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: ARCH_VARIANT
        value: basic
      - key: EMAIL_BACKEND
        value: brevo
      - key: EMAIL_FROM
        sync: false                  # correo validado en Brevo (p. ej. tu Gmail)
      - key: EMAIL_FROM_NAME
        value: InkaSec
      - key: BREVO_API_KEY
        sync: false                  # clave de la API de Brevo (secreta)

  - type: web
    name: inkasec-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: /api/v1               # mismo origen: la API se alcanza por la regla de reescritura
    routes:
      - type: rewrite
        source: /api/*
        # Si Render cambió el nombre de la API, pon aquí su URL real (ver README).
        destination: https://inkasec-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: inkasec-db
    databaseName: inkasec
    user: inkasec
    plan: free
